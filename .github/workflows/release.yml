name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: td.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: td
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: td
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: td-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Prepare release assets
        run: |
          mkdir -p release
          cp artifacts/td-x86_64-pc-windows-msvc/td.exe release/td-windows-x86_64.exe
          cp artifacts/td-x86_64-unknown-linux-gnu/td release/td-linux-x86_64
          cp artifacts/td-x86_64-apple-darwin/td release/td-macos-x86_64
          chmod +x release/td-linux-x86_64 release/td-macos-x86_64
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
